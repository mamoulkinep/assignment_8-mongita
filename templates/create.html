{% extends 'base.html' %}

{% block container %}
<section id="catRight" style="width:100%; display:block;">
    <div style="padding:40px; max-width:600px; margin:auto; background:white;">
        <h2>Create a New Book</h2>

        <form action="{{ url_for('create_post') }}" method="POST">
            <label>Title:</label><br>
            <input type="text" name="title" required><br><br>

            <label>Author:</label><br>
            <input type="text" name="author" required><br><br>

            <label>ISBN:</label><br>
            <input type="text" name="isbn" required><br><br>

            <label>Price:</label><br>
            <input type="number" step="0.01" name="price" required><br><br>

            <label>Category:</label><br>
            <select name="categoryId" required>
                {% for cat in categories %}
                    <option value="{{ cat['categoryId'] }}">
                        {{ cat['categoryName'] }}
                    </option>
                {% endfor %}
            </select><br><br>

            <label>Image filename:</label><br>
            <input type="text" name="image" placeholder="example.jpg" required><br><br>

            <label>Read Now:</label><br>
            <select name="readNow" required>
                <option value="0">0 - No</option>
                <option value="1">1 - Yes</option>
            </select><br><br>

            <button type="submit">Create Book</button>
            <a class="commandButton" href="{{ url_for('read') }}">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
