{% extends 'base.html' %}

{% block container %}
<section id="catRight" style="width:100%; display:block;">
    <div style="padding:40px; max-width:600px; margin:auto; background:white;">
        <h2>Edit Book</h2>

        <form action="{{ url_for('edit_post', id=book['bookId']) }}" method="POST">
            <label>Title:</label><br>
            <input type="text" name="title" value="{{ book['title'] }}" required><br><br>

            <label>Author:</label><br>
            <input type="text" name="author" value="{{ book['author'] }}" required><br><br>

            <label>ISBN:</label><br>
            <input type="text" name="isbn" value="{{ book['isbn'] }}" required><br><br>

            <label>Price:</label><br>
            <input type="number" step="0.01" name="price" value="{{ book['price'] }}" required><br><br>

            <label>Category:</label><br>
            <select name="categoryId" required>
                {% for cat in categories %}
                    <option value="{{ cat['categoryId'] }}"
                        {% if cat['categoryId'] == book['categoryId'] %}selected{% endif %}>
                        {{ cat['categoryName'] }}
                    </option>
                {% endfor %}
            </select><br><br>

            <label>Image filename:</label><br>
            <input type="text" name="image" value="{{ book['image'] }}" required><br><br>

            <label>Read Now:</label><br>
            <select name="readNow" required>
                <option value="0" {% if book['readNow'] == 0 %}selected{% endif %}>0 - No</option>
                <option value="1" {% if book['readNow'] == 1 %}selected{% endif %}>1 - Yes</option>
            </select><br><br>

            <button type="submit">Save Changes</button>
            <a class="commandButton" href="{{ url_for('read') }}">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
